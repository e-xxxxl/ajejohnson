  <body>

    <script>
      // Arm scroll-reveal only when the browser can drive it. Without this
      // class, all content renders fully visible (no-JS / reduced-motion safe).
      try {
        if (
          'IntersectionObserver' in window &&
          !window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ) {
          document.documentElement.classList.add('reveal-ready')
        }
      } catch (e) {}
